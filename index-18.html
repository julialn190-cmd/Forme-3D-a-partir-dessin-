<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'><title>Sculpture 3D</title><style>body{margin:0;font-family:system-ui;background:#111;color:#eee}header{padding:12px 16px;background:#1b1b1b}main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 52px)}aside{padding:14px;background:#181818;overflow:auto}#view{width:100%;height:100%;display:block}.row{margin:12px 0}label{display:block;font-size:13px;margin-bottom:5px}input,button{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#242424;color:#fff}button{margin-top:8px;background:#eee;color:#111;font-weight:700}.hint{font-size:12px;color:#aaa;line-height:1.4}@media(max-width:720px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:42vh}#view{min-height:58vh}}</style></head><body><header><b>Sculpture 3D — prototype mobile</b></header><main><aside><div class='row'><label>Image de référence</label><input id='img' type='file' accept='image/*'><div id='imgStatus' class='hint' style='margin-top:8px'>Aucune image chargée</div><img id='preview' alt='Aperçu' style='display:none;width:100%;max-height:180px;object-fit:contain;margin-top:10px;border-radius:8px;border:1px solid #444;background:#0d0d0d'></div><div class='row'><label>Hauteur finale (mm)</label><input id='h' type='number' value='500'></div><div class='row'><label>Largeur (mm)</label><input id='w' type='number' value='360'></div><div class='row'><label>Profondeur (mm)</label><input id='d' type='number' value='220'></div><div class='row'><label>Complexité organique</label><input id='complex' type='range' min='3' max='12' value='8'></div><button id='regen'>Générer / mettre à jour</button><button id='stl'>Exporter STL</button><p class='hint'>Prototype local : il crée une sculpture organique fermée et exportable en STL. La reconstruction fidèle depuis plusieurs vues nécessite ensuite un moteur de vision/3D côté serveur.</p></aside><canvas id='view'></canvas></main><script type='module'>
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/controls/OrbitControls.js';
import {STLExporter} from 'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/exporters/STLExporter.js';
const c=document.querySelector('#view'), r=new THREE.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor(0x101010);const s=new THREE.Scene();const cam=new THREE.PerspectiveCamera(45,1,.1,5000);cam.position.set(650,420,650);const ctl=new OrbitControls(cam,c);ctl.enableDamping=true;s.add(new THREE.HemisphereLight(0xffffff,0x333333,2));const dl=new THREE.DirectionalLight(0xffffff,3);dl.position.set(300,500,300);s.add(dl);let group;
function blob(x,y,z,rx,ry,rz){const g=new THREE.SphereGeometry(1,40,28);g.scale(rx,ry,rz);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xd8d0c3,roughness:.72,metalness:0}));m.position.set(x,y,z);return m}
function build(){if(group)s.remove(group);group=new THREE.Group();const H=+h.value,W=+w.value,D=+d.value,n=+complex.value;for(let i=0;i<n;i++){const t=i/(n-1), y=-H/2+t*H*.92;const phase=t*10;const x=Math.sin(phase)*W*.17*(1-t*.25);const z=Math.cos(phase*1.17)*D*.13;const rx=W*(.25-.09*t)*(1+.22*Math.sin(phase*1.7));const ry=H*(.12+.035*Math.cos(phase));const rz=D*(.28-.08*t)*(1+.25*Math.cos(phase*1.3));group.add(blob(x,y,z,rx,ry,rz));}group.add(blob(0,-H*.46,0,W*.47,H*.09,D*.44));s.add(group);ctl.target.set(0,0,0)}
function resize(){const w=c.clientWidth,h=c.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}function loop(){resize();ctl.update();r.render(s,cam);requestAnimationFrame(loop)}const imgInput=document.querySelector('#img'), preview=document.querySelector('#preview'), imgStatus=document.querySelector('#imgStatus');
imgInput.addEventListener('change',()=>{const file=imgInput.files&&imgInput.files[0];if(!file){preview.style.display='none';imgStatus.textContent='Aucune image chargée';return;}if(!file.type.startsWith('image/')){imgStatus.textContent='Fichier non reconnu comme image';return;}const reader=new FileReader();reader.onload=e=>{preview.src=e.target.result;preview.style.display='block';imgStatus.textContent='Image chargée : '+file.name;try{localStorage.setItem('sculpture3d_reference',e.target.result);localStorage.setItem('sculpture3d_reference_name',file.name)}catch(_){}};reader.onerror=()=>imgStatus.textContent='Impossible de lire cette image';reader.readAsDataURL(file)});
try{const saved=localStorage.getItem('sculpture3d_reference');if(saved){preview.src=saved;preview.style.display='block';imgStatus.textContent='Image mémorisée : '+(localStorage.getItem('sculpture3d_reference_name')||'référence')}}catch(_){}
regen.onclick=build;stl.onclick=()=>{const ex=new STLExporter(),data=ex.parse(group,{binary:true});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));a.download='sculpture_500mm.stl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};build();loop();
</script></body></html>
